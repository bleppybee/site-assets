<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Special Medicine — Little Horrors</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at top, #201724, #08070c 65%); color: #b3a6b8; font-family: "Courier New", monospace; }
    main { display: grid; justify-items: center; gap: 12px; }
    #stage { position: relative; line-height: 0; box-shadow: 0 0 0 1px #3a303e, 0 22px 90px #000b; }
    #c { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    #t { position: absolute; inset: 0; pointer-events: none; }
    footer { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 0 10px; max-width: 100vw; font-size: 11px; line-height: 1.5; }
    kbd { color: #e2d4c6; font: inherit; }
    button { border: 1px solid #493c50; padding: 4px 8px; color: #d8c9df; background: #17111e; font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { border-color: #d5bd9a; outline-color: #d5bd9a; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <main aria-label="Special Medicine game">
    <h1 class="sr-only">Special Medicine — Little Horrors</h1>
    <div id="stage">
      <canvas id="c" width="320" height="180" aria-label="Game view" aria-describedby="controls">This game needs a browser with canvas support.</canvas>
      <canvas id="t" aria-hidden="true"></canvas>
    </div>
    <footer id="controls">
      <span><kbd>WASD / Arrows</kbd> move</span>
      <span><kbd>Z / Enter / Space / E</kbd> interact</span>
      <button id="mute" type="button" aria-pressed="false">Sound: on (M)</button>
    </footer>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script src="sprites.js"></script>
  <script src="game.js"></script>
</body>
</html>
