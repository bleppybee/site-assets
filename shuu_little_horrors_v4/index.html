<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Little Horrors — Shuu Reimagined</title>
<style>
  :root {
    --bg:#08090d;
    --panel:#121317;
    --line:#302d35;
    --text:#ddd6d2;
    --muted:#8c8390;
    --accent:#d6baa1;
  }
  html,body{height:100%;margin:0;background:radial-gradient(circle at top,#120d15,#09090b 60%);color:var(--text);font-family:monospace;overflow:hidden}
  body{display:grid;place-items:center}
  #wrap{position:relative;width:960px;height:540px;box-shadow:0 0 0 1px #26262b,0 26px 100px rgba(0,0,0,.8),inset 0 0 28px rgba(0,0,0,.45)}
  canvas{width:100%;height:100%;display:block;background:#0d0d10;image-rendering:pixelated;image-rendering:crisp-edges}
  #help{position:absolute;left:12px;top:10px;font-size:12px;color:#b5adba;text-shadow:1px 1px #000;pointer-events:none;letter-spacing:.08em}
  #title{position:absolute;right:12px;top:10px;font-size:11px;color:#6b6872;letter-spacing:.18em;pointer-events:none}
  #start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,8,11,.78);text-align:center;cursor:pointer;backdrop-filter:blur(1px)}
  #start .card{border:1px solid #3a3438;background:linear-gradient(180deg,#111116,#0a0a0d);padding:22px 28px;max-width:540px;box-shadow:0 0 0 1px rgba(255,255,255,.03), 0 14px 50px rgba(0,0,0,.55)}
  #start h1{margin:0 0 8px;font-size:24px;color:#efe2d6;font-weight:normal;letter-spacing:.12em;text-transform:uppercase}
  #start p{margin:8px 0;color:#ac9ea5;line-height:1.5}
  #start b{color:#f2e7d6}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="320" height="180"></canvas>
  <div id="help">WASD / ARROWS move · Z / ENTER interact</div>
  <div id="title">LITTLE HORRORS // REIMAGINED</div>
  <div id="start"><div class="card"><h1>Little Horrors</h1><p>A darker, more atmospheric version of Shuu’s first bad morning.</p><p><b>Click to begin.</b></p><p>Sound helps. Keep the room quiet.</p></div></div>
</div>
<script src="game.js"></script>
</body>
</html>
