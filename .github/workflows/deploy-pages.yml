name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare game files
        run: |
          mkdir -p _site/shuu_little_horrors_v4/assets
          cp index.html game.js sprites.js _site/
          cp shuu_animation_sheet_cropped.png madoka_animation_sheet_cropped.png _site/
          cp shuu_little_horrors_v4/assets/*.png _site/shuu_little_horrors_v4/assets/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
