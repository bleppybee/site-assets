// sprite sheet = 2x2 cells. Each frame is cropped from its own visible bounds
// so we don't clip the character against a hardcoded rectangle.

X.imageSmoothingEnabled=false;
function fit(){ const s=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px'; }
addEventListener('resize',fit); fit();

/* ---------------- sprite loading + white keying ---------------- */
function loadArt(k){
  const a=ART[k]; const im=new Image(); im.crossOrigin='anonymous';
  im.onload=()=>{
    try{
      const oc=document.createElement('canvas'); oc.width=im.width; oc.height=im.height;
      const o=oc.getContext('2d'); o.drawImage(im,0,0);
      const d=o.getImageData(0,0,oc.width,oc.height), p=d.data;
      for(let i=0;i<p.length;i+=4){ if(p[i]>232&&p[i+1]>232&&p[i+2]>232) p[i+3]=0; }
      o.putImageData(d,0,0); a.img=oc;
    }catch(e){ a.img=im; }   // tainted canvas -> use raw, it may already be transparent
    a.ready=true;
  };
  im.onerror=()=>{ a.ready=false; };
  im.src=a.src;
}
loadArt('shuu'); loadArt('madoka');

/* ---------------- audio ---------------- */
let AC=null, muted=false, drone=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,dur,type,vol,slide){
  if(muted||!ac())return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.value=f;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),AC.currentTime+dur);
  g.gain.value=(vol||0.05); g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
}
function noise(dur,vol,lp){
  if(muted||!ac())return;
  const n=AC.sampleRate*dur, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||900;
  const g=AC.createGain(); g.gain.value=vol||0.12;
  s.connect(f).connect(g).connect(AC.destination); s.start();
}
function blip(){ tone(620+Math.random()*90,0.03,'square',0.022); }
function thud(){ tone(70,0.35,'sine',0.16,28); noise(0.22,0.10,500); }
function droneOn(){ if(muted||!ac()||drone)return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sawtooth'; o.frequency.value=41; g.gain.value=0.0001;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;
  o.connect(f).connect(g).connect(AC.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.06, AC.currentTime+2.5);
  drone={o,g};
}
function droneOff(){ if(!drone)return; const d=drone; drone=null;
  try{ d.g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+1.0);
       d.o.stop(AC.currentTime+1.2);}catch(e){} }

/* ---------------- input ---------------- */
const keys={};
let onConfirm=null, choice=null, mash=null;
const CONFIRM=['KeyZ','Space','Enter','KeyE'];
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.repeat){ if(mash) return; }
  keys[e.code]=true;
  if(e.code==='KeyM'){ muted=!muted; if(muted) droneOff(); return; }
  if(mash && CONFIRM.includes(e.code)){ mash.hits++; return; }
  if(choice && !e.repeat){
    if(e.code==='ArrowUp'||e.code==='KeyW'){ choice.i=(choice.i+choice.opts.length-1)%choice.opts.length; blip(); }
    if(e.code==='ArrowDown'||e.code==='KeyS'){ choice.i=(choice.i+1)%choice.opts.length; blip(); }
    if(CONFIRM.includes(e.code)){ const c=choice; choice=null; dlg=null; tone(500,.06,'square',.04); c.res(c.i); }
    return;
  }
  if(CONFIRM.includes(e.code)){
    if(onConfirm){ const f=onConfirm; onConfirm=null; f(); return; }
    if(roam && !lock){ tryInteract(); return; }
  }
});
addEventListener('keyup',e=>{ keys[e.code]=false; });

/* ---------------- text ---------------- */
X.font='8px "Courier New", Courier, monospace';
function wrap(t,max){
  const out=[]; t.split('\n').forEach(par=>{
    let line='';
    par.split(' ').forEach(w=>{
      const test=line?line+' '+w:w;
      if(X.measureText(test).width>max && line){ out.push(line); line=w; } else line=test;
    });
    out.push(line);
  });
  return out;
}
let dlg=null;
function say(who,text,opt){
  opt=opt||{};
  return new Promise(res=>{
    dlg={who:who||'', lines:wrap(text,282), n:0, total:text.replace(/\n/g,'').length,
         speed:opt.speed||1.6, col:opt.col||'#e6e2ea', flip:!!opt.flip};
    const step=()=>{
      if(dlg && dlg.n < dlg.total){ dlg.n=dlg.total; onConfirm=step; }
      else { dlg=null; res(); }
    };
    onConfirm=step;
  });
}
function choose(text,opts){
  return new Promise(res=>{
    dlg={who:'',lines:wrap(text,282),n:999,total:999,speed:2,col:'#e6e2ea'};
    choice={opts,i:0,res};
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- tweens ---------------- */
const tweens=[];
function tw(set,from,to,ms){ return new Promise(r=>tweens.push({set,from,to,ms,t:0,r})); }
function stepTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const t=tweens[i]; t.t+=dt;
    const k=Math.min(1,t.t/t.ms);
    t.set(t.from+(t.to-t.from)*k);
    if(k>=1){ tweens.splice(i,1); t.r(); }
  }
}

/* ---------------- drawing helpers ---------------- */
function px(c,x,y,w,h){ X.fillStyle=c; X.fillRect(x|0,y|0,w|0,h|0); }

function drawSheet(key,x,y,h,dir){
  const a=ART[key];
  if(a.ready&&a.img){
    const img=a.img;
    const cell=Math.min(img.width, img.height) / 2;
    const sx=(dir===DIR.down)?0:(dir===DIR.up)?cell:(dir===DIR.right)?0:cell;
    const sy=(dir===DIR.down||dir===DIR.up)?0:cell;
    const frame=getVisibleFrame(img, sx, sy, cell, cell);
    const sourceW=Math.max(1, frame.w);
    const sourceH=Math.max(1, frame.h);
    const w=Math.round(h * sourceW / sourceH);
    X.drawImage(img,
      sx + frame.x, sy + frame.y,
      sourceW, sourceH,
      Math.round(x - w/2), Math.round(y - h),
      w, h);
    return;
  }
  fallbackChar(a.pal,x,y,h,dir);
}
function getVisibleFrame(img, sx, sy, sw, sh){
  const c=document.createElement('canvas');
  c.width=sw; c.height=sh;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,sw,sh);
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const data=ctx.getImageData(0,0,sw,sh).data;
  let minX=sw, minY=sh, maxX=-1, maxY=-1;
  for(let y=0; y<sh; y++){
    for(let x=0; x<sw; x++){
      const alpha=data[(y*sw+x)*4+3];
      if(alpha > 8){
        if(x < minX) minX=x;
        if(y < minY) minY=y;
        if(x > maxX) maxX=x;
        if(y > maxY) maxY=y;
      }
    }
  }
  if(maxX < 0) return {x:0, y:0, w:sw, h:sh};
  return {x:minX, y:minY, w:Math.max(1, maxX - minX + 1), h:Math.max(1, maxY - minY + 1)};
}
function fallbackChar(p,x,y,h,dir){
  const w=Math.round(h*0.62), l=Math.round(x-w/2);
  px(p.leg,l+2,y-h*0.30,w-4,h*0.24);
  px(p.shoe,l+2,y-4,w-4,4);
  px(p.coat,l,y-h*0.66,w,h*0.38);
  px(p.skin,l+3,y-h*0.76,w-6,h*0.12);
  px(p.hair,l+1,y-h,w-2,h*0.30);
  if(dir!==DIR.up){ px('#22223a',l+4,y-h*0.72,2,2); px('#22223a',l+w-6,y-h*0.72,2,2); }
}
function silhouette(x,y,h,hairCol,coatCol,skinCol,dark){
  const w=Math.round(h*0.58), l=Math.round(x-w/2);
  const H2=dark?'#0a0a10':hairCol, C=dark?'#0d0d14':coatCol, S=dark?'#101018':skinCol;
  px('#0a0a10',l+2,y-h*0.32,w-4,h*0.32);
  px(C,l,y-h*0.68,w,h*0.38);
  px(S,l+3,y-h*0.78,w-6,h*0.12);
  px(H2,l+1,y-h,w-2,h*0.28);
}
function floorboards(y,h,col){
  X.fillStyle=col;
  for(let x=0;x<W;x+=18) X.fillRect(x,y,1,h);
}
function dustify(level){
  if(level<=0) return;
  X.globalAlpha=0.10*level; px('#8a8272',0,0,W,H); X.globalAlpha=1;
  X.globalAlpha=0.35*level;
  for(let i=0;i<70;i++){
    const s=(i*77+loopN*13)%W, t=(i*53)%H;
    px('#6f6a60',s,t,1,1);
  }
  X.globalAlpha=1;
}

/* ---------------- interactables ---------------- */
function objects(){
  const O=[];
  if(room==='kids'){
    O.push({r:[12,86,78,42], use:useMadoka});
    O.push({r:[96,18,74,26], use:async()=>{
      await say('','[Drawings. Cats, dogs, a robot with too many arms.]');

    O.push({r:[196,104,34,28], use:async()=>{

    }});
    O.push({r:[248,36,48,68], use:async()=>{
      if(loopN===1){ await say('','[The closet. Coats, boxes, the smell of dust.]'); return; }

      await say('','[Behind the boxes there is a metal case. It is not locked.]');

      if(D()>0){ await say('','[Two of the photographs have been taken out of their frames.]');
                 await say('','[The dust shows exactly where they were.]'); }

    }});
    O.push({r:[138,34,32,70], use:async()=>{
      await say('','[Mama\'s room. The door is shut.]');
      await say('SHUU','...She said not to wake her up before three.');
      if(loopN>1){ await say('SHUU','(She wouldn\'t know what to do anyway. She\'d just make it about her.)',{col:'#8e8898'}); }
    }});
    O.push({r:[258,34,38,70], use:async()=>{
      if(D()>0){ await say('','[The lamp is broken. Someone kicked it, a long time from now.]'); return; }
      await say('','[A standing lamp. The shade is on crooked.]');
      await say('','[On the back of the shade: crayon. A crude anime face.]');
      await say('SHUU','...Madoka did that. Don\'t tell.');

  if(room==='kitchen'){
    O.push({r:[108,14,70,60], use:useCabinet});

      await say('','[Inside: rations. Tinned everything. Nothing for a fever.]');

    O.push({r:[24,34,24,34], use:async()=>{
      await say('','[The telephone.]');
      if(loopN===1){ await say('SHUU','...Who do you even call.'); }
      else { await say('','[You lift the receiver. Static, and under it, something that breathes.]');
             noise(0.5,0.06,1400);
             await say('SHUU','...Hello? Hello.');
             await say('','[No one has ever answered this phone.]'); }
    }});
  }
  return O;
}

function tryInteract(){
  const px_=player.x, py=player.y-8;
  const list=objects();
  for(const o of list){
    const [rx,ry,rw,rh]=o.r;
    if(px_>rx-12 && px_<rx+rw+12 && py>ry-14 && py<ry+rh+16){
      lock=true; tone(480,.05,'square',.04);
      Promise.resolve(o.use()).then(()=>{ lock=false; });
      return;
    }
  }
}

/* ---------------- the two key interactions ---------------- */
async function useMadoka(){
  if(!hasMed){
    if(loopN===1){
      await say('MADOKA','...Shuu-niisan.');
      await say('MADOKA','It\'s so hot. Cough— ...it\'s so hot in here.');
      await say('SHUU','Do you want water?');
      await say('MADOKA','I had water.');
      await say('','[Her face is wet. She is shaking under the blanket.]');
      await say('SHUU','(Mama has a special medicine in the kitchen cabinet.)',{col:'#a8a2b4'});
      await say('SHUU','(She drinks it when she feels bad. Then she feels better.)',{col:'#a8a2b4'});
    } else {
      await say('MADOKA','What\'s the matter... cough...');
      await say('SHUU','...');
      await say('MADOKA','I don\'t think there\'s anything you can do about this.');
      await say('MADOKA','...Shuu-niisan. Do you hate me?');
      await say('SHUU','...No.');
      await say('MADOKA','But Aunt Ikue—');
      await say('SHUU','...It\'s okay. Maybe I can find you some medicine.');
      await say('','[You could stay here. You could just sit down on the floor and stay here.]',{col:'#8e8898'});
    }
    return;
  }
  roam=false; lock=true;
  if(roamRes){ const r=roamRes; roamRes=null; r(); }
}

async function useCabinet(){
  if(hasMed){ await say('SHUU','I\'ve got it. I\'ve got it already.'); return; }
  await say('','[The cabinet. Bottles. Most of them are empty.]');
  await say('','[One at the back is still half full. Brown glass. No label you can read.]');
  if(loopN===1){
    await say('SHUU','This is the one. This is the special medicine.');
    hasMed=true; tone(700,.08,'triangle',.05); await wait(90); tone(900,.12,'triangle',.05);
    await say('','[ GOT: SPECIAL MEDICINE ]',{col:'#e8d48a'});
  } else {
    const c=await choose('Take the medicine?',['YES','NO']);
    if(c===1){
      await say('SHUU','...No. Not this. I know what this is now.');
      await wait(700);
      await say('','[But I\'m just a kid.]',{col:'#8e8898'});
      await wait(500);
      await say('','[...So I take it anyway.]',{col:'#8e8898'});
    } else {
      await say('SHUU','This is the one. This is the special medicine.');
    }
    hasMed=true; tone(700,.08,'triangle',.05); await wait(90); tone(900,.12,'triangle',.05);
    await say('','[ GOT: SPECIAL MEDICINE ]',{col:'#e8d48a'});
  }
}

/* ---------------- the mash ---------------- */
function mashPrompt(label,ms,ceiling,notes){
  return new Promise(res=>{
    mash={label,ms,t:0,hits:0,v:0,ceiling,notes,note:0,res};
  });
}
function stepMash(dt){
  if(!mash)return;
  mash.t+=dt;
  mash.v += mash.hits*0.085;
  if(mash.hits) tone(300+mash.v*400,.03,'square',.03);
  mash.hits=0;
  mash.v -= dt*0.00042;
  if(mash.v>mash.ceiling){ mash.v=mash.ceiling;
    mash.note=Math.min(mash.notes.length-1,mash.note+ (Math.random()<0.25?1:0)); }
  if(mash.v<0) mash.v=0;
  if(mash.t>=mash.ms){ const m=mash; mash=null; m.res(); }
}

/* ---------------- movement ---------------- */
function solidAt(x,y){
  const S=ROOMS[room].solid;
  for(const s of S){ if(x>s[0]&&x<s[0]+s[2]&&y>s[1]&&y<s[1]+s[3]) return true; }
  return false;
}
function movePlayer(dt){
  if(!roam||lock||dlg||mash) { player.walk=0; return; }
  const sp=dt*0.052; let dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA){dx-=1;player.dir=DIR.left;}
  if(keys.ArrowRight||keys.KeyD){dx+=1;player.dir=DIR.right;}
  if(keys.ArrowUp||keys.KeyW){dy-=1;if(!dx)player.dir=DIR.up;}
  if(keys.ArrowDown||keys.KeyS){dy+=1;if(!dx)player.dir=DIR.down;}
  if(dx&&dy){dx*=0.7071;dy*=0.7071;}
  player.walk = (dx||dy) ? player.walk+dt : 0;
  let nx=player.x+dx*sp, ny=player.y+dy*sp;
  ny=Math.max(108,Math.min(174,ny));
  if(!solidAt(nx,ny)) player.x=nx;
  if(!solidAt(player.x,ny)) player.y=ny;
  // exits
  const ex=ROOMS[room].exits;
  if(ex.east && player.x>313){ room=ex.east; player.x=10; tone(260,.07,'sine',.05); }
  if(ex.west && player.x<7){ room=ex.west; player.x=312; tone(260,.07,'sine',.05); }
  player.x=Math.max(6,Math.min(314,player.x));
}

/* ---------------- render ---------------- */
function render(){
  X.save();
  if(shake>0){ X.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake); }
  ROOMS[room].draw();

  // actors
  for(const a of actors){
    if(a.kind==='sil') silhouette(a.x,a.y,a.h,a.hair,a.coat,a.skin,hallu>0.45);
    else drawSheet(a.kind,a.x,a.y,a.h,a.dir);
  }
  if(room==='kids' && (madokaState==='standing'||madokaState==='gun')){
    drawSheet('madoka',52,138,42,DIR.right);
    if(madokaState==='gun'){ px('#1c1c22',66,120,10,3); }
  }
  if(room==='kids' && madokaState==='knelt'){
    drawSheet('madoka',150,150,34,DIR.down);
  }
  if(!player.hidden) drawSheet('shuu',player.x,player.y,36,player.dir);

  X.restore();

  // hallucination desaturation + squeeze
  if(hallu>0){
    X.globalCompositeOperation='saturation';
    X.fillStyle='rgba(128,128,128,'+Math.min(1,hallu)+')';
    X.fillRect(0,0,W,H);
    X.globalCompositeOperation='source-over';
    X.globalAlpha=0.30*hallu; px('#000010',0,0,W,H); X.globalAlpha=1;
    X.globalAlpha=0.18*hallu;
    for(let y=0;y<H;y+=2) px('#000',0,y,W,1);
    X.globalAlpha=1;
  }
  // vignette
  const g=X.createRadialGradient(W/2,H/2,40,W/2,H/2,190);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.75)');
  X.fillStyle=g; X.fillRect(0,0,W,H);
  // grain
  X.globalAlpha=grainAmt;
  for(let i=0;i<110;i++) px(Math.random()<0.5?'#fff':'#000',Math.random()*W|0,Math.random()*H|0,1,1);
  X.globalAlpha=1;
  // flash
  if(flash>0){ X.globalAlpha=Math.min(1,flash); px('#fff',0,0,W,H); X.globalAlpha=1; }

  drawUI();

  if(fade>0){ X.globalAlpha=Math.min(1,fade); px('#000',0,0,W,H); X.globalAlpha=1; }
  if(showEndText) drawEnd();
}

function drawUI(){
  if(mash){
    const bw=140, bx=(W-bw)/2, by=96;
    px('#000',bx-3,by-15,bw+6,32);
    X.fillStyle='#e6e2ea'; X.textAlign='center';
    X.fillText(mash.label,W/2,by-5);
    px('#2a2630',bx,by,bw,8);
    px('#b0364a',bx+1,by+1,Math.max(0,(bw-2)*Math.min(1,mash.v)),6);
    px('#4a4450',bx+bw*mash.ceiling,by,1,8);
    if(mash.v>=mash.ceiling-0.02){
      X.fillStyle='#8e8898'; X.fillText(mash.notes[mash.note],W/2,by+17);
    }
    X.textAlign='left';
    return;
  }
  if(!dlg) {
    if(roam&&!lock){
      const near=objects().some(o=>{const[r0,r1,r2,r3]=o.r;
        return player.x>r0-12&&player.x<r0+r2+12&&player.y-8>r1-14&&player.y-8<r1+r3+16;});
      if(near){ X.fillStyle='#cfc6d8'; X.textAlign='center'; X.fillText('[Z]',player.x,player.y-42); X.textAlign='left'; }
    }
    return;
  }
  const bh=8+dlg.lines.length*10+ (choice?choice.opts.length*10:0) + 6;
  const by=H-bh-4;
  px('#000',6,by,W-12,bh);
  px('#3a3444',6,by,W-12,1); px('#3a3444',6,by+bh-1,W-12,1);
  px('#3a3444',6,by,1,bh); px('#3a3444',W-7,by,1,bh);
  let shown=Math.floor(dlg.n), yy=by+13;
  X.fillStyle=dlg.col;
  if(dlg.who){ X.fillStyle='#8e8898'; X.fillText(dlg.who+':',12,yy-4); }
  for(const ln of dlg.lines){
    const take=Math.max(0,Math.min(ln.length,shown));
    X.fillStyle=dlg.col;
    X.fillText(ln.slice(0,take),12,yy+ (dlg.who?4:0));
    shown-=ln.length; yy+=10;
  }
  if(choice){
    choice.opts.forEach((o,i)=>{
      X.fillStyle = i===choice.i ? '#e8d48a' : '#6e687a';
      X.fillText((i===choice.i?'> ':'  ')+o, 20, yy+i*10 + (dlg.who?4:0));
    });
  } else if(dlg.n>=dlg.total && Math.floor(performance.now()/420)%2===0){
    X.fillStyle='#e8d48a'; X.fillText('\u25BE',W-20,H-10);
  }
}
function drawEnd(){
  px('#000',0,0,W,H);
  X.textAlign='center';
  X.fillStyle='#d8d2e0'; X.fillText(showEndText.a,W/2,H/2-4);
  if(showEndText.b){ X.fillStyle='#6e687a'; X.fillText(showEndText.b,W/2,H/2+14); }
  X.textAlign='left';
}

/* ---------------- loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last); last=now;
  stepTweens(dt); stepMash(dt); movePlayer(dt);
  if(dlg && dlg.n<dlg.total){
    const before=Math.floor(dlg.n);
    dlg.n+=dt*0.001*60*dlg.speed*0.55;
    if(Math.floor(dlg.n)>before && Math.floor(dlg.n)%2===0) blip();
    if(dlg.n>dlg.total) dlg.n=dlg.total;
  }
  if(flash>0) flash-=dt*0.004;
  if(shake>0) shake=Math.max(0,shake-dt*0.01);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

      px('#07060a',0,0,W,H);

      X.fillStyle='#c8bed6'; X.fillText('S P E C I A L   M E D I C I N E',W/2,70);

        X.fillStyle='#e8d48a'; X.fillText('[Z] BEGIN',W/2,160);

      X.fillStyle='#3e3848'; X.fillText('arrows move   Z interact   M mute',W/2,174);

  });
  fade=1;
}

  await say('SHUU','I gave Madoka the medicine. The one in the kitchen cabinet.');

  await say('IKUE','Oh, sweetheart.');
  await say('IKUE','That\'s not your fault. This is what happened to you.');
  await say('SHUU','But if I hadn\'t given it to her, none of it would have happened.');

async function finalEnd(){
  showEndText={a:'Am I too passive...?',b:''};
  await wait(2400);
  showEndText={a:'Am I too... stupid?',b:''};
  await wait(2400);
  showEndText={a:'Mama tells me I\'m a genius.',b:''};
  await wait(2000);

  showEndText=null;

  loopN=6; room='kids'; madokaState='none'; bloodT=0.35; player.hidden=true; fade=1;
  await tw(setFade,1,0,4000);
  await wait(5000);
  await tw(setFade,0,1,4000);
  showEndText={a:'SPECIAL  MEDICINE',b:'thank you for playing'};

}

async function runLoop(n){
  loopN=n; hasMed=false; room='kids'; madokaState='bed'; bloodT=0;
  player.x=170; player.y=140; player.dir=DIR.left; player.hidden=false;
  actors=[]; hallu=0; showEndText=null;
  fade=1;
  await tw(setFade,1,0,2200);
  await wait(400);
  if(n===1){
    lock=true;
    await say('','[Your cousin has been coughing since yesterday.]');
    await say('','[Aunt Ikue is asleep. Everyone else is out getting rations.]');
    await say('','[It is just you.]');
    lock=false;
  } else {
    lock=true;
    await say('','[Your cousin has been coughing since yesterday.]');
    await say('','[You have done this before. You remember doing this before.]',{col:'#8e8898'});
    lock=false;
  }
  roam=true;
  await new Promise(r=>{ roamRes=r; });
  roam=false;
  await theEvent();
  await epilogue();
}

async function main(){
  await title();
  await runLoop(1);
  // wait for input to restart
  await new Promise(r=>{ onConfirm=r; });
  await runLoop(2);
  await new Promise(r=>{ onConfirm=r; });
  await finalEnd();
}
